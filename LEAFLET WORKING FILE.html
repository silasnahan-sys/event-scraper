<!doctype html>
<html>
    <head>
        <title>LEAFLET MAP WITH LABELS - Map class supporting labels for Leaflet</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
        <link rel="stylesheet" href="./leaflet-mapwithlabels.css" />
        <script src="./leaflet-mapwithlabels.js"></script>
        <style>
            html, body {
                height: 100%;
                margin: 0;
            }
            #map_div {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="map_div"></div>

        <!-- #SILAS - use the cambridge and somerville filenames that you have. My filenames might be different than yours-->
        <script src="./BOUNDARY_CDDNeighborhoods_geojson.js"></script>
        <script src="./somervilleNeighborhoods-geojson.js"></script>

        <script>
            // list object properties in html format
            let props = o => {
                let s = '';
                for (let i in o) s += i + ': ' + o[i] + '<br/>';
                return s;
            }

            // #SILAS: you can probably improve these boundary coordinates. These values were just a quick earch
            const map = L.mapWithLabels('map_div').fitBounds([[42.39, -71.06], [42.39, -71.14]]);

            function polyColor(f) {
				let p=f.properties.Nepesseg;
                let r=Math.random()*150+100;
                let g=Math.random()*150+100;
                let b=Math.random()*150+100;
                return { fillColor: `rgb(${r},${g},${b})`, fillOpacity: .7, color: 'black', opacity: 1, weight: 1 };
            }                  
			
            // Cambridge
            // statesData is the var that stores the Cambridge Data
            L.geoJSON(cambridgeNeighborhoods, {
                label: l=>l.feature.properties.NAME, 
                labelPos: 'cc', 
                labelStyle: { fontWeight: 'bold', whiteSpace: 'normal', minWidth: '120px', textAlign: 'center'},
                labelPriority: 5e4,
                style: polyColor
            }).addTo(map).bindPopup(l => props(l.feature.properties));

            // Somerville neighborhoods
            L.geoJSON(somervilleNeighborhoods, {
                label: l => l.feature.properties.NAME,
                labelPos: 'cc',
                labelStyle: { fontWeight: 'bold', whiteSpace: 'normal', minWidth: '120px', textAlign: 'center' },
                labelPriority: 5e4,
                style: polyColor
            }).addTo(map).bindPopup(l => props(l.feature.properties));
               
        </script>
    </body>
</html>

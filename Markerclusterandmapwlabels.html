        <script>
            // list object properties in html format
            let props = o => {
                let s = '';
                for (let i in o) s += i + ': ' + o[i] + '<br/>';
                return s;
            }

            // #SILAS: you can probably improve these boundary coordinates. These values were just a quick earch
            const map = L.mapWithLabels('map_div').fitBounds([[42.353813, -71.102608], [42.419111, -71.121319

]]);
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);


            function polyColor(f) {
				let p=f.properties.Nepesseg;
                let r=Math.random()*150+100;
                let g=Math.random()*150+100;
                let b=Math.random()*150+100;
                return { fillColor: `rgb(${r},${g},${b})`, fillOpacity: .7, color: 'black', opacity: 1, weight: 1 };
            }                  
			
            // Cambridge
            // statesData is the var that stores the Cambridge Data
            L.geoJSON(cambridgeNeighborhoods, {
                label: l=>l.feature.properties.NAME, 
                labelPos: 'cc', 
                labelStyle: { fontWeight: 'bold', whiteSpace: 'normal', minWidth: '120px', textAlign: 'center'},
                labelPriority: 5e4,
                style: polyColor
            }).addTo(map).bindPopup(l => props(l.feature.properties));

            // Somerville neighborhoods
            L.geoJSON(somervilleNeighborhoods, {
                label: l => l.feature.properties.NAME,
                labelPos: 'cc',
                labelStyle: { fontWeight: 'bold', whiteSpace: 'normal', minWidth: '120px', textAlign: 'center' },
                labelPriority: 5e4,
                style: polyColor
            }).addTo(map).bindPopup(l => props(l.feature.properties));

            	const info = L.control();

	info.onAdd = function (map) {
		this._div = L.DomUtil.create('div', 'info');
		this.update();
		return this._div;
	};

	info.update = function (props) {
		const contents = props ? `<b>${props.NAME}</b><br />${props.density} people / mi<sup>2</sup>` : 'Hover over a neighborhood';
		this._div.innerHTML = `<h4>Cambridge Neighborhoods</h4>${contents}`;
		const dispname = props ? props.NAME : '';
		const dispDistrict = props ? props.District : '';
		console.log('props.name:', dispname,'dispDistrict:', dispDistrict);
	};

	info.addTo(map);
	// get color depending on population density value
	function getColor(d) {
		return d > 1000 ? '#800026' :
			d > 500  ? '#BD0026' :
			d > 200  ? '#E31A1C' :
			d > 100  ? '#FC4E2A' :
			d > 50   ? '#FD8D3C' :
			d > 20   ? '#FEB24C' :
			d > 10   ? '#FED976' : '#FFEDA0';
	}

	function style(feature) {
		return {
			weight: 2,
			opacity: 1,
			color: 'white',
			dashArray: '3',
			fillOpacity: 0.7,
			fillColor: getColor(feature.properties.density)
		};
	}
	function resetHighlight(e) {
		geojson.resetStyle(e.target);
		info.update();
	}

	function zoomToFeature(e) {
		map.fitBounds(e.target.getBounds());
	}

	function onEachFeature(feature, layer) {
		layer.on({
			mouseover: highlightFeature,
			mouseout: resetHighlight,
			click: zoomToFeature
		});
	}

	map.attributionControl.addAttribution('Population data &copy; <a href="http://census.gov/">US Census Bureau</a>');


	const legend = L.control({position: 'bottomright'});

	legend.onAdd = function (map) {

		const div = L.DomUtil.create('div', 'info legend');
		const grades = [0, 10, 20, 50, 100, 200, 500, 1000];
		const labels = [];
		let from, to;

		for (let i = 0; i < grades.length; i++) {
			from = grades[i];
			to = grades[i + 1];

			labels.push(`<i style="background:${getColor(from + 1)}"></i> ${from}${to ? `&ndash;${to}` : '+'}`);
		}

		div.innerHTML = labels.join('<br>');
		return div;
	};

	legend.addTo(map);


 ///// This starts the new section for the Marker Cluster Plugin

	// In the example online, this data is in the "realworld.388.js"
	// The data in that file is not in cambridge/somerville
	// So I picked 8 local places to show how this works
	var addressPoints = [
			[42.38985, -71.1185, "star market"],
			[42.39392, -71.125408, "pemberton"],
			[42.381935, -71.120084, "ramen o bowlA"],
			[42.399784, -71.133761, "jacks gas"],

const deflate_features = L.deflate({minSize: 20, markerLayer: markers});
deflate_features.addTo(map);

		for (var i = 0; i < addressPoints.length; i++) {

			console.log('title',title, a[0], a[1]);

		}

	map.addLayer(markers);

      L.marker([51.941196,4.512291], {icon: L.AwesomeMarkers.icon({icon: 'spinner', prefix: 'fa', markerColor: 'red', spin:true}) }).addTo(map);
    L.marker([42.3665694,-71.1233244], {icon: L.AwesomeMarkers.icon({icon: 'coffee', prefix: 'fa', markerColor: 'red', iconColor: '#f28f82'}) }).addTo(map);
    L.marker([42.3741209,-71.1107166], {icon: L.AwesomeMarkers.icon({icon: 'airplane-outline', prefix: 'fa', markerColor: 'purple', iconColor: 'black'}) }).addTo(map);
    L.marker([51.932835,4.506969], {icon: L.AwesomeMarkers.icon({icon: 'glass', prefix: 'fa', markerColor: 'green'}) }).addTo(map);
    L.marker([51.930295,4.515209], {icon: L.AwesomeMarkers.icon({icon: 'shopping-cart', prefix: 'fa', markerColor: 'blue'}) }).addTo(map);
    L.marker([51.930083,4.507742], {icon: L.AwesomeMarkers.icon({icon: 'info', prefix: 'fa', markerColor: 'orange'}) }).addTo(map);

    L.marker([51.928919,4.528856], {icon: L.AwesomeMarkers.icon({icon: 'twitter', prefix: 'fa', markerColor: 'cadetblue'}) }).addTo(map);

    L.marker([51.925902,4.505768], {icon: L.AwesomeMarkers.icon({icon: 'medkit', prefix: 'fa', markerColor: 'darkblue'}) }).addTo(map);
      var layer = L.markerClusterGroup();
        var features = L.deflate({minSize: 20, markerLayer: layer});
        features.addTo(map);

        L.polygon([
            [42.372305,-71.122165],
            [42.3966492,-71.1230295],
            [42.3784429,-71.1233492],
            [42.37375,-71.1000805],
        ])
        .bindPopup('UPS')
        .addTo(features);
        
        L.marker([42.372305,-71.122165]).addTo(features);

        L.marker([42.3784429,-71.1233492]).addTo(features);
        L.marker([42.37375,-71.1000805]).addTo(features);
        layer.freezeAtZoom(15);



		
// Store the layer so we can find Davis Square later
const neighborhoodLayer = L.geoJSON(somervilleNeighborhoods, {
    label: l => l.feature.properties.NAME,
    labelPos: 'cc',
    labelStyle: { fontWeight: 'bold', whiteSpace: 'normal', minWidth: '120px', textAlign: 'center' },
    labelPriority: 5e4,
    style: polyColor
}).addTo(map).bindPopup(l => `<b>${l.feature.properties.NAME}</b>`);


// 2. THE HIGH-PRIORITY SYNC LISTENER
window.addEventListener('message', function(event) {
    if (event.data.action === 'sync-resize-fly') {
        
        let targetCenter;
        neighborhoodLayer.eachLayer(layer => {
            if (layer.feature.properties && layer.feature.properties.NAME === "Davis Square") {
                targetCenter = layer.getBounds().getCenter();
            }
        });

        if (targetCenter) {
            // 1. Immediately force a re-calculation
            map.invalidateSize({ animate: false, pan: false });

            // 2. Start the flyTo
        map.flyTo(targetCenter, 16, {
    animate: true,
    duration: 1.0, 
    noMoveStart: true, // Prevents vectors from disappearing or jumping at the start
    easeLinearity: 0.1
});

            // 3. THE "HAMMER" LOOP: Force redraws every 50ms for 1 second
            // This is the most reliable way to fix the "clumped in corner" bug.
            let elapsed = 0;
            const syncTimer = setInterval(() => {
                map.invalidateSize({ animate: false, pan: false });
                
                // This specific line forces the SVG polygons to stretch
                if (map._renderer) {
                    map._renderer._update(); 
                }

                // Keeps labels pinned to the polygons
                if (typeof map._updateLabels === 'function') {
                    map._updateLabels();
                }

                elapsed += 50;
                if (elapsed > 1000) clearInterval(syncTimer);
            }, 50);
        }
    }
	
});


     </script>

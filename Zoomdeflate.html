<!doctype html>
<html>
    <head>
          <link rel="stylesheet" href="./overlaycss.css">
    </head>

              <div class="container">
              <h1>Events from January 30 – February 13</h1>
              <time datetime="2024-01-30T00:00:00Z">January 30, 2024</time>   
  <section class="modal hidden">
    <div class="flex">
  <img src="./Events from January 30 – February 13 – Cambridge _ Somerville Independent_files/the-moderate.jpeg" width="50px" height="50px" alt="user" />
      <button class="btn-close">⨉</button>
    </div>
    <div>
      <h3>Stay in touch</h3>
      <p>
        This is a dummy newsletter form so don't bother trying to test it. Not
        that I expect you to, anyways.
      </p>
    </div>
    <input type="email" id="email" placeholder="brendaneich@js.com" />
    <button class="btn">Submit</button>
  </section>

  
      <script>
      const modal = document.querySelector(".modal");
  const overlay = document.querySelector(".overlay");
  const openModalBtn = document.querySelector(".btn-open");
  const closeModalBtn = document.querySelector(".btn-close");
      </script>
          <script>
  const openModal = function () {
    modal.classList.remove("hidden");
    overlay.classList.remove("hidden");
  };
  openModalBtn.addEventListener("click", openModal);
  </script>   


  <script>
      const closeModal = function () {
    modal.classList.add("hidden");
    overlay.classList.add("hidden");
  };
  closeModalBtn.addEventListener("click", closeModal);
  overlay.addEventListener("click", closeModal);


  document.addEventListener("keydown");
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modal.classList.contains("hidden")) {
      closeModal();
    }
  });
  </script>

    </body> 
</html>

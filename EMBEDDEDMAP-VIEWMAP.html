function updateEverything() {
    if (!ticking) {
        window.requestAnimationFrame(function() {
            svg.selectAll("circle") // Selects all red dots
                .attr("cx", d => map.latLngToLayerPoint([d.lat, d.long]).x)

            svg.selectAll("circle").each(function() {

            });
            ticking = false;

    }

var mcgLayerSupportGroup = L.markerClusterGroup.layerSupport({
    iconCreateFunction: function (cluster) {
        var markers = cluster.getAllChildMarkers();
        var counts = {};
        var maxCat = 'default';
        var maxCount = 0;

        // Count occurrences of each category in this specific cluster
        markers.forEach(function(m) {
            var cat = m.options.category || 'default';
            counts[cat] = (counts[cat] || 0) + 1;
            
            // Priority/Majority Logic: Pick the category with the most markers
            if (counts[cat] > maxCount) {
                maxCount = counts[cat];
                maxCat = cat;
            }
        });

        return L.divIcon({
            html: '<div><span>' + cluster.getChildCount() + '</span></div>',
            // The cluster now takes the color of the majority category
            className: 'marker-cluster cluster-' + maxCat,
            iconSize: new L.point(40, 40)
        });
    }
});

function getDayLayer(date) {

function normalizeAddress(address) {
    if (!address) return '';

    // Strip newlines/extra spaces, remove parenthetical bits, and normalize punctuation
    let normalized = address
        .replace(/\s+/g, ' ')
        .replace(/\s*\(.*?\)\s*/g, ' ')          // remove parenthesized notes
        .replace(/[–—]/g, ',')                       // normalize dashes to commas
        .replace(/\s*,\s*/g, ', ')                 // normalize comma spacing
        .replace(/\s*;\s*/g, ', ')                 // normalize semicolons too
        .replace(/\s*&\s*/g, ' & ')               // normalize ampersands
        .trim()
        .replace(/,+$/, '')                         // strip trailing commas
        .replace(/\.+$/, '');                        // strip trailing periods

    // Expand common abbreviations for better geocoding
    // IMPORTANT: Remove periods BEFORE expanding abbreviations to avoid double periods
    normalized = normalized
        .replace(/\bSt\.?\b/gi, 'Street')
        .replace(/\bAve\.?\b/gi, 'Avenue')
        .replace(/\bRd\.?\b/gi, 'Road')
        .replace(/\bBlvd\.?\b/gi, 'Boulevard')
        .replace(/\bPl\.?\b/gi, 'Place')
        .replace(/\bSq\.?\b/gi, 'Square')
        .replace(/\bDr\.?\b/gi, 'Drive')
        .replace(/\bLn\.?\b/gi, 'Lane')
        .replace(/\bTer\.?\b/gi, 'Terrace')
        .replace(/\bPkwy\.?\b/gi, 'Parkway')
        // Also handle state abbreviations
        .replace(/\bMA\.?\b/gi, 'MA')
        .replace(/\bMass\.?\b/gi, 'MA');

    // Clean up any remaining double periods or spaces
    normalized = normalized
        .replace(/\.+/g, '.')                       // collapse multiple periods to single
        .replace(/\s+/g, ' ')                       // collapse multiple spaces
        .trim();

    // Check if a city/state already exists (any MA city or state abbreviation/name)
    const hasCityState = /\b(Cambridge|Somerville|Boston|Medford|Brookline|Newton|Watertown|Waltham|Arlington|Belmont|Lexington|Winchester|Malden|Everett|Salem|Lynn|Quincy|Milton|Norwood|MA|Massachusetts)\b/i.test(normalized);
    
    // Only add Cambridge, MA if NO city/state detected at all
    if (!hasCityState) {
        normalized += ', Cambridge, MA';
    }
    
    // If it has a city but missing MA state, add MA
    if (!/(MA|Massachusetts)\b/i.test(normalized)) {
        normalized += ', MA';
    }

    return normalized;
}

function geocodeAddress(address) {
    if (!address) return Promise.resolve(null);

    const normalized = normalizeAddress(address);
    if (geocodeCache.has(normalized)) return Promise.resolve(geocodeCache.get(normalized));

    const debugText = `geocode: ${normalized}`;
    console.debug('[MapIframe] geocodeAddress', { original: address, normalized });
    setGeocodeDebug(debugText);

    // Add delay to respect Nominatim rate limits (1 req/sec)
    return new Promise(resolve => setTimeout(resolve, 300)).then(() => {
        return provider.search({ query: normalized }).then(results => {
            if (!results || !results.length) {
                console.warn('[MapIframe] geocodeAddress no results', normalized);
                setGeocodeDebug(`no results: ${normalized} (fallback)`);
                return nominatimGeocode(normalized);
            }
            const coords = { lat: results[0].y, lng: results[0].x };
            geocodeCache.set(normalized, coords);
            return coords;
        }).catch(err => {
            console.error('[MapIframe] geocodeAddress error (geosearch failed)', normalized, err);
            setGeocodeDebug(`geosearch error: ${normalized} (fallback)`);
            return nominatimGeocode(normalized);
        });
    });
}

function nominatimGeocode(query) {
    // Try multiple query variations to handle edge cases
    const variations = [
        query,                                      // original
        query.replace(/, MA$/i, ''),               // without MA
        query.replace(/\d+\s+/, ''),               // without building number (just street name)
        query.replace(/,[^,]*MA$/, ''),            // without city & MA
        query.split(',')[0],                        // just the street address part
    ];

    // Remove duplicates
    const uniqueVariations = [...new Set(variations)].filter(v => v && v.trim().length > 3);

    const tryVariation = (idx) => {
        if (idx >= uniqueVariations.length) {
            console.warn('[MapIframe] nominatim exhausted all variations for:', query);
            setGeocodeDebug(`exhausted: ${query}`);
            return Promise.resolve(null);
        }

        const q = uniqueVariations[idx].trim();
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        
        console.debug('[MapIframe] trying nominatim variation', idx + 1, '/', uniqueVariations.length, ':', q);

        return fetch(url, {
            headers: {
                'Accept': 'application/json',
                'User-Agent': 'Cambridge-Somerville-Map/1.0 (+http://127.0.0.1:5500)'
            }
        })
            .then(r => {
                if (!r.ok) {
                    console.warn(`[MapIframe] nominatim HTTP ${r.status} for:`, q);
                    return tryVariation(idx + 1);  // try next variation
                }
                return r.json();
            })
            .then(results => {
                if (!Array.isArray(results) || !results.length) {
                    console.debug('[MapIframe] nominatim no results for variation', q);
                    return tryVariation(idx + 1);  // try next variation
                }
                const coords = { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
                geocodeCache.set(query, coords);
                console.debug('[MapIframe] nominatim success (var', idx + 1, '):', q, '→', coords);
                setGeocodeDebug(`ok (v${idx + 1}): ${q}`);
                return coords;
            })
            .catch(err => {
                console.warn('[MapIframe] nominatim variation error', q, err);
                return tryVariation(idx + 1);  // try next variation
            });
    };

    return tryVariation(0);
}

function createEventMarker(lat, lng, title, cat, group) {
    var m = L.marker([lat, lng], { category: cat }).bindPopup(title);
    m.addTo(group);
    return m;
}

// Track in-progress geocoding to prevent concurrent updates on same layer
const processingLayers = {};

function addEventsToDayLayer(date, events) {
    if (!date || !Array.isArray(events)) {
        console.warn('[MapIframe] addEventsToDayLayer called with invalid args');
        return;
    }

    // If this date is already being processed, skip to avoid duplicates
    if (processingLayers[date]) {
        console.debug('[MapIframe] already processing events for', date, '- skipping to avoid duplicates');
        return;
    }

    processingLayers[date] = true;
    console.debug('[MapIframe] addEventsToDayLayer START', { date, eventCount: events.length });
    
    const layer = getDayLayer(date);

    // Show only the selected day's event layer to avoid cross-day visual mixing.
    Object.keys(dayLayers).forEach(dayKey => {
        if (dayKey !== date && map.hasLayer(dayLayers[dayKey])) {
            map.removeLayer(dayLayers[dayKey]);
        }
    });
    
    // CRITICAL: fully clear the layer (including all cached data)
    layer.clearLayers();
    console.debug('[MapIframe] layer cleared:', date);

    // Only show debug marker if there are no events
    if (events.length === 0) {
        console.debug('[MapIframe] no events, showing empty marker');
        L.circleMarker(map.getCenter(), { radius: 10, color: '#ff0000', weight: 2, fillOpacity: 0.3 })
            .bindPopup(`Day: ${date} (no events)`)
            .addTo(layer);
        processingLayers[date] = false;
        return;
    }

    let completedCount = 0;
    let skippedCount = 0;

    // Process geocoding sequentially to avoid rate limiting
    const processEvent = (index) => {
        if (index >= events.length) {
            console.debug('[MapIframe] finished processing all', events.length, 'events for', date, '| added:', completedCount, '| skipped:', skippedCount);
            processingLayers[date] = false;  // Mark as complete
            return;
        }

        const evt = events[index];
        if (!evt || !evt.address) {
            console.debug('[MapIframe] skipping event at', index, '- no address');
            processEvent(index + 1);
            return;
        }

        console.debug('[MapIframe] processing event', index + 1, 'of', events.length, ':', evt.address);

        geocodeAddress(evt.address).then(coords => {
            const cat = evt.category || 'default';
            if (coords) {
                console.debug('[MapIframe] geocoded successfully:', evt.address, coords);
                const marker = createEventMarker(coords.lat, coords.lng, evt.title || evt.address, cat, layer);
                marker.bindPopup(`<strong>${evt.title}</strong><br>${evt.address}`);
                completedCount++;
            } else {
                console.warn('[MapIframe] geocode failed, skipping marker for:', evt.address);
                skippedCount++;
            }
            // Process next event
            processEvent(index + 1);
        }).catch((err) => {
            console.error('[MapIframe] geocode error for:', evt.address, err);
            skippedCount++;
            // Process next event
            processEvent(index + 1);
        });
    };

    // Start sequential processing
    processEvent(0);

    // Ensure this day layer is visible when selected
    if (!map.hasLayer(layer)) {
        console.debug('[MapIframe] adding layer to map:', date);
        layer.addTo(map);
    }
    
    console.debug('[MapIframe] addEventsToDayLayer END');
}

function setAllEventsLayer(events) {

    events.forEach(evt => {

            createEventMarker(coords.lat, coords.lng, evt.title || evt.address, cat, allLayer);
        });

}

function showMarkersForDate(date) {

    console.debug('[MapIframe] showMarkersForDate', date);

    const layer = getDayLayer(date);
    if (!map.hasLayer(layer)) {
        layer.addTo(map);
    }

    const bounds = layer.getBounds();
    if (bounds.isValid && bounds.isValid()) {
        map.flyToBounds(bounds, { padding: [50, 50], duration: 0.7 });
    }
}

// 8. THE INTEGRATED SEARCH FILTER / DAY SELECTION
// Single consolidated message listener to prevent duplicate processing
let lastProcessedEvent = null;

window.addEventListener('message', function(e) {
    console.debug('[MapIframe] message received', e.data);
    if (!e.data) return;

    // Prevent processing the same event twice
    if (lastProcessedEvent && JSON.stringify(lastProcessedEvent) === JSON.stringify(e.data)) {
        console.debug('[MapIframe] skipping duplicate event');
        return;
    }
    lastProcessedEvent = e.data;

    if (e.data.action === 'filter-layers') {
        const query = e.data.keyword.toLowerCase();
        const mapDiv = document.getElementById('mapid');

        const layerMap = {
            'theater': theater,
            'music': music,
            'community': community,
            'west': WestCambridge
        };

        let activeMarkers = [];

        Object.keys(layerMap).forEach(key => {
            const layer = layerMap[key];
            const isMatch = key.includes(query) || query === "";

            if (isMatch) {
                // mcgLayerSupportGroup automatically clusters/unclusters these
                if (!map.hasLayer(layer)) layer.addTo(map); 
                layer.eachLayer(m => activeMarkers.push(m));
            } else {
                map.removeLayer(layer);
            }
        });

        // 9. VISUAL "APPARENCY" MODE
        // If searching, dim the background and zoom to specific results
        setTimeout(function() {
            map.invalidateSize();

            if (query !== "" && activeMarkers.length > 0) {
                const bounds = L.featureGroup(activeMarkers).getBounds();
                map.flyToBounds(bounds, { padding: [50, 50], duration: 1.2 });
                document.getElementById('mapid').classList.add('map-highlight-active');
            } else {
                document.getElementById('mapid').classList.remove('map-highlight-active');
            }
        }, 500); // 500ms matches the CSS transition time

    } else if (e.data.action === 'select-day') {
        showMarkersForDate(e.data.date);
    } else if (e.data.action === 'set-all-events') {
        setAllEventsLayer(e.data.events || []);
    } else if (e.data.action === 'set-day-events') {
        console.debug('[MapIframe] processing set-day-events for', e.data.date, 'with', e.data.events.length, 'events');
        addEventsToDayLayer(e.data.date, e.data.events || []);
    } else if (e.data.action === 'sync-resize-fly') {
        // Also handle search/fly requests in the same listener
        const vc = e.data.vc;
        if (vc) {
            console.log("Searching for:", vc);
            runSearch(vc);
        }
    }
});

function runSearch(combinedData) {
    if (!region || !combinedData) return;

    const parts = combinedData.split(" | ");
    const vTitle = parts[0];   
    const vAddress = parts[1]; 

    let searchQuery = vAddress;
    if (!searchQuery.toLowerCase().includes("ma")) searchQuery += ", MA";

    const provider = new window.GeoSearch.OpenStreetMapProvider({
        params: {
            countrycodes: 'us',
            limit: 1
        }
    });

    setGeocodeDebug(`searching: ${searchQuery}`);

    provider.search({ query: searchQuery }).then(results => {
        if (results.length === 0) {
            console.warn("Geosearch failed for address:", searchQuery);
            return;
        }

        const result = results[0]; 
        const latlng = L.latLng(result.y, result.x);

        // SYNC: Handles CSS expansion before flight
        map.options.zoomSnap = 0; 
        map.options.zoomDelta = 0.1;

        let startTime = performance.now();
        function syncExpansion(now) {
            map.invalidateSize({ animate: false, pan: false });
            if (map._renderer) map._renderer._update();
            if (now - startTime < 600) {
                requestAnimationFrame(syncExpansion);
            } else {
                map.invalidateSize();
                startLiquidFlight(latlng, vTitle, vAddress);
            }
        }
        requestAnimationFrame(syncExpansion);
    });
}

function startLiquidFlight(latlng, vTitle, vAddress) {
    let targetLayer = null;      
    
    // Find the neighborhood (Ray-Casting)
    region.eachLayer(function(layer) {
        if (targetLayer) return; 
        if (isMarkerInsidePolygon(latlng, layer)) {
            targetLayer = layer; 
            console.log("Success! Found neighborhood:", layer.feature.properties.NAME);
        }
    });

    // 1. ALWAYS Create the Marker immediately
    const marker = L.circleMarker(latlng, {
        radius: 8,
        color: 'orange',
        fillColor: '#ff7800',
        fillOpacity: 0.8,
        weight: 2
    }).addTo(map);

    if (targetLayer) {
        // CASE: INSIDE NEIGHBORHOOD
        const nName = targetLayer.feature.properties.NAME;
        const requestedId = targetLayer.feature.properties.OBJECTID; 

        // Set Popup with Neighborhood Name
        marker.bindPopup(`<strong>${nName}</strong><br>${vTitle}<br>${vAddress}`).openPopup();

        // LIQUID FLIGHT: Smooth, slow transition to neighborhood bounds
        map.flyToBounds(targetLayer.getBounds(), {
            padding: [40, 40],
            duration: 3.0,       // Slower for cinematic feel
            easeLinearity: 0.08,  // Very fluid, soft stop
            noMoveStart: true
        });

        // 2. D3 CLICK TRIGGER: Mid-flight (1.8s) for "Liquid" interaction
        setTimeout(() => {
            const d3Target = d3.selectAll("path.neighborhood")
                .filter(d => d && d.properties && d.properties.OBJECTID === requestedId);
            
            if (!d3Target.empty()) {
                const node = d3Target.node();
                const handler = d3.select(node).on('click');
                if (handler) {
                    // Visual cue: temporary pulse or highlight
                    d3.select(node).transition().duration(500).style("fill-opacity", 0.5);
                    handler.call(node, d3.select(node).datum());
                }
            }
        }, 1800); 

    } else {
        // CASE: OUTSIDE (Near boundary)
        console.warn("No neighborhood found for this point.");
        marker.bindPopup(`<strong>${vTitle}</strong><br>${vAddress}<br><em>(Near boundary)</em>`).openPopup();
        
        map.flyTo(latlng, 17, { 
            duration: 2.5,
            easeLinearity: 0.1 
        });
    }
}

// 5. Robust Point-in-Polygon (Ray-Casting) Math
function isMarkerInsidePolygon(latlng, poly) {
    const x = latlng.lat, y = latlng.lng;
    const json = poly.toGeoJSON();
    const type = json.geometry.type;
    const coords = json.geometry.coordinates;

    function checkRing(ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
            const xi = ring[i][1], yi = ring[i][0]; // [Lat, Lng]
            const xj = ring[j][1], yj = ring[j][0];
            const intersect = ((yi > y) !== (yj > y)) &&
                (x < ((xj - xi) * (y - yi) / (yj - yi) + xi));
            if (intersect) inside = !inside;
        }
        return inside;
    }

    if (type === "Polygon") return checkRing(coords[0]);
    if (type === "MultiPolygon") return coords.some(p => checkRing(p[0]));
    return false;
}

<!DOCTYPE html>
<html>
<head>
  <title>Indie Events</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: auto; }
    input { width: 100%; padding: 10px; margin: 20px 0; }
    .event { padding: 10px; border-bottom: 1px solid #ccc; }
    .music { color: green; }
    .talk { color: blue; }
    .workshop { color: orange; }
  </style>
</head>
<body>

<h1>Indie Events</h1>

<input id="search" placeholder="Search events...">

<div id="events"></div>

<script>
async function load() {
  const res = await fetch("events.json");
  const data = await res.json();

  const container = document.getElementById("events");

  function render(filter="") {
    container.innerHTML = "";

data.sort((a,b) => new Date(a.start) - new Date(b.start))      .filter(e => e.title.toLowerCase().includes(filter.toLowerCase()))
      .forEach(e => {
        const div = document.createElement("div");
        div.className = "event " + e.category;

        div.innerHTML = `
          <b>${e.title}</b><br>
          ${new Date(e.start).toLocaleString()}<br>
          <small>${e.category}</small>
        `;

        container.appendChild(div);
      });
  }

  document.getElementById("search").oninput = (e) => {
    render(e.target.value);
  };

  render();
}

load();
</script>

</body>
</html>

<!-- Create an element where the map will take place -->
<div id="mapid"></div>
   

<style>
#mapid { height: 400px; }
</style>

<script>
    var map;
    try {
        // center on Somerville/Cambridge area to see neighborhood data
        map = L.mapWithLabels('mapid', { 
            center: [42.3840352, -71.1134377], 
            zoom: 13,
            zoomSnap: 0,
            zoomDelta: 0.1,
            wheelPxPerZoomLevel: 120
        });
    } catch (e) {
        console.warn("mapWithLabels plugin not found, using standard Leaflet map.");
        // FIXED: Changed 'map-canvas' to 'mapid' to match your HTML div
        map = L.map('mapid').setView([42.3840352, -71.1134377], 13);
    }
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // --- PART 1: SVG CIRCLES (Global View) ---
    L.svg().addTo(map);

    var markers = [
        {long: 9.083, lat: 42.149}, {long: 7.26, lat: 43.71},
        {long: 2.349, lat: 48.864}, {long: -1.397, lat: 43.664},
        {long: 3.075, lat: 50.640}, {long: -3.83, lat: 48}
    ];

    // Select the Leaflet-generated SVG
    var svg = d3.select("#mapid").select("svg");
    
    var circles = svg.selectAll("circle")
        .data(markers)
        .enter()
        .append("circle")
        .attr("r", 14)
        .style("fill", "red")
        .attr("stroke", "red")
        .attr("stroke-width", 3)
        .attr("fill-opacity", .4);

    function updateCircles() {
        circles
            .attr("cx", function(d){ return map.latLngToLayerPoint([d.lat, d.long]).x })
            .attr("cy", function(d){ return map.latLngToLayerPoint([d.lat, d.long]).y });
    }

    // Sync circles on map movement
    map.on("move viewreset", updateCircles);
    updateCircles();

    // --- PART 2: NEIGHBORHOOD OVERLAY (GeoJSON) ---
    var neighborhoodData = [];

    var d3Overlay = L.d3SvgOverlay(function (sel, proj) {
        var paths = sel.selectAll('path').data(neighborhoodData);
        
        paths.enter()
            .append('path')
            .attr('class', 'neighborhood')
            .attr('stroke', 'black')
            .attr('fill', function() { return d3.hsl(Math.random() * 360, 0.7, 0.5); })
            .attr('fill-opacity', '0.5')
            .on('mouseover', function() {
                d3.select(this).transition().duration(150).attr('fill-opacity', '0.8');
            })
            .on('mouseout', function() {
                d3.select(this).transition().duration(150).attr('fill-opacity', '0.5');
            })
            .on('click', function(d) {
                map.fitBounds(L.geoJson(d).getBounds());
            });

        paths.attr('d', proj.pathFromGeojson)
             .attr('stroke-width', 1 / proj.scale);
    });

    // Load GeoJSON and activate overlay
    d3.json("./somervilleNeighborhoods (2).geo.json", function(error, data) {
        if (error) {
            console.error("GeoJSON Error:", error);
            return;
        }
        neighborhoodData = data.features;
        d3Overlay.addTo(map);
    });
</script>

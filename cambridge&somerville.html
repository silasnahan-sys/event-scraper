
<!DOCTYPE html>

<head>

	<title>Choropleth Tutorial - Leaflet</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
  <link rel="stylesheet" href="./leaflet.awesome-markers.css">
   <link re	l="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
   

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

	<style>
	#map { width: 800px; height: 800px; }
.info { padding: 6px 8px; font: 14px/16px Arial, Helvetica, sans-serif; background: white; background: rgba(255,255,255,0.8); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; } .info h4 { margin: 0 0 5px; color: #777; }
.legend { text-align: left; line-height: 18px; color: #555; } .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }</style>

    <!-- This is th	e new section added for the Market Cluster Plugin -->
	<!-- I moved each of these files from the dist folder into the same folder as this map html file -->
	<link rel="stylesheet" href="./MarkerCluster.css" />
	<link rel="stylesheet" href="./MarkerCluster.Default.css" />
	<script src="./leaflet.markercluster-src.js"></script>
	<link rel="stylesheet" href="./leaflet-notifications.css"></script>
  <script src="./leaflet.awesome-markers.js"></script>


</head>
<body>


<div id='map_div'></div>

<script type="text/javascript" src="cambridgeMapdata.js"></script>
<script type="text/javascript" src="us-states.js"></script>
<script src="./leaflet.centermarker.js"></script>
	<script src="./leaflet-notifications.js"></script>
<script src="./leaflet.awesome-markers.js"></script>
<script type="text/javascript">

	// United states
	//const map = L.map('map').setView([37.8, -96], 4);

	// Cambridge, MA
		// Latitude and longitude coordinates are: 42.373611, -71.110558.
		// kirland and beacon streets
		// Latitude: 42.3767 (42°22'36" N)
		// Longitude: -71.1131(71°06'47" W) 

const map = L.map('map_div').setView([42.373611, -71.110558], 13);

	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);	

	// control that shows state info on hover
	const info = L.control();

	info.onAdd = function (map) {
		this._div = L.DomUtil.create('div', 'info');
		this.update();
		return this._div;
	};

	info.update = function (props) {
		const contents = props ? `<b>${props.NAME}</b><br />${props.density} people / mi<sup>2</sup>` : 'Hover over a neighborhood';
		this._div.innerHTML = `<h4>Cambridge Neighborhoods</h4>${contents}`;
		const dispname = props ? props.NAME : '';
		const dispDistrict = props ? props.District : '';
		console.log('props.name:', dispname,'dispDistrict:', dispDistrict);
	};

	info.addTo(map);


	// get color depending on population density value
	function getColor(d) {
		return d > 1000 ? '#800026' :
			d > 500  ? '#BD0026' :
			d > 200  ? '#E31A1C' :
			d > 100  ? '#FC4E2A' :
			d > 50   ? '#FD8D3C' :
			d > 20   ? '#FEB24C' :
			d > 10   ? '#FED976' : '#FFEDA0';
	}

	function style(feature) {
		return {
			weight: 2,
			opacity: 1,
			color: 'white',
			dashArray: '3',
			fillOpacity: 0.7,
			fillColor: getColor(feature.properties.density)
		};
	}

	
	// statesData is somerville DATA
	const geojson = L.geoJson(statesData, {
		style,
		onEachFeature
	}).addTo(map);

	const geojsonCambridge = L.geoJson(cambridgedistrictData, {
			style,
			onEachFeature
		}).addTo(map);

	
	map.attributionControl.addAttribution('Population data &copy; <a href="http://census.gov/">US Census Bureau</a>');


	const bookIcon = L.icon({
			iconUrl: 'book_icon.png',
			iconSize: [38, 38],
			iconAnchor: [22, 22],
			popupAnchor: [-3, -76]
	});
	
	const musicIcon = L.icon({
			iconUrl: 'musical-note-black-icon-symbol-transparent-png.png',
			iconSize: [38, 38],
			iconAnchor: [22, 22],
			popupAnchor: [-3, -76]
	});
     
	// This is creating a data set of 4 locations
	const venues = [
		{ coordinates: [42.367843, -71.099929], options: { title: "229 Harvard" }},
		{ coordinates: [42.401424, -71.13354], options: { title: "26 Murray Hill" } },
		{ coordinates: [42.366126, -71.105291], options: { title: "Cantab Lounge", icon: musicIcon } },
		{ coordinates: [42.372541, -71.116363], options: { title: "Harvard Book Store", icon: bookIcon } },
	]

	// This loops through the venues data set and puts the markers on the map
	venues.forEach(element => {
		const { coordinates, options }  = element;
		L.marker(coordinates, options).addTo(map);
	})

	///// This starts the new section for the Marker Cluster Plugin

	// In the example online, this data is in the "realworld.388.js"
	// The data in that file is not in cambridge/somerville
	// So I picked 8 local places to show how this works
	var addressPoints = [
			[42.38985, -71.1185, "star market"],
			[42.39392, -71.125408, "pemberton"],
			[42.381935, -71.120084, "ramen o bowlA"],
			[42.399784, -71.133761, "jacks gas"],
			[42.367843, -71.099929, "229 Harvard"],
			[42.401424, -71.13354, "26 Murray Hill"],
			[42.366126, -71.105291, "Cantab Lounge"],
			[42.372541, -71.116363, "Harvard Book Store"]];

	var markers = L.markerClusterGroup({
	iconCreateFunction: function(cluster) {
		return L.divIcon({
			maxClusterRadius: 120,
			iconCreateFunction: function (cluster) {
				var markers = cluster.getAllChildMarkers();
				var n = 0;
				for (var i = 0; i < markers.length; i++) {
					n += markers[i].number;
				}
				return L.divIcon({ html: n, className: 'mycluster', iconSize: L.point(40, 40) });
			},
			//Disable all of the defaults:
			spiderfyOnMaxZoom: false, showCoverageOnHover: false, zoomToBoundsOnClick: false
		});
	}
});

		for (var i = 0; i < addressPoints.length; i++) {
			var a = addressPoints[i];
			var title = a[2];
			var marker = L.marker(new L.LatLng(a[0], a[1]), { title: title });
			console.log('title',title, a[0], a[1]);
			marker.bindPopup(title);
			markers.addLayer(marker);
		}

	map.addLayer(markers)

    L.marker([51.941196,4.512291], {icon: L.AwesomeMarkers.icon({icon: 'spinner', prefix: 'fa', markerColor: 'red', spin:true}) }).addTo(map);
    L.marker([42.3665694,-71.1233244], {icon: L.AwesomeMarkers.icon({icon: 'coffee', prefix: 'fa', markerColor: 'red', iconColor: '#f28f82'}) }).addTo(map);
    L.marker([42.3741209,-71.1107166], {icon: L.AwesomeMarkers.icon({icon: 'airplane-outline', prefix: 'fa', markerColor: 'purple', iconColor: 'black'}) }).addTo(map);
    L.marker([51.932835,4.506969], {icon: L.AwesomeMarkers.icon({icon: 'glass', prefix: 'fa', markerColor: 'green'}) }).addTo(map);
    L.marker([51.930295,4.515209], {icon: L.AwesomeMarkers.icon({icon: 'shopping-cart', prefix: 'fa', markerColor: 'blue'}) }).addTo(map);
    L.marker([51.930083,4.507742], {icon: L.AwesomeMarkers.icon({icon: 'info', prefix: 'fa', markerColor: 'orange'}) }).addTo(map);

    L.marker([51.930454,4.527054], {icon: L.AwesomeMarkers.icon({icon: 'group', prefix: 'fa', markerColor: 'darkred'}) }).addTo(map);
    L.marker([51.929607,4.527054], {icon: L.AwesomeMarkers.icon({icon: 'arrow-right', prefix: 'fa', markerColor: 'darkblue'}) }).addTo(map);
    L.marker([51.928919,4.528856], {icon: L.AwesomeMarkers.icon({icon: 'twitter', prefix: 'fa', markerColor: 'cadetblue'}) }).addTo(map);
    L.marker([51.930295,4.530745], {icon: L.AwesomeMarkers.icon({icon: 'phone', prefix: 'fa', markerColor: 'darkpurple'}) }).addTo(map);
    L.marker([51.925055,4.512806], {icon: L.AwesomeMarkers.icon({icon: 'ambulance', prefix: 'fa', markerColor: 'darkgreen'}) }).addTo(map);
    L.marker([51.925902,4.505768], {icon: L.AwesomeMarkers.icon({icon: 'medkit', prefix: 'fa', markerColor: 'darkblue'}) }).addTo(map);


		var notification = L.control
    .notifications({
        timeout: 3000,
        position: 'topright',
        closable: true,
        dismissable: true,
    })
    .addTo(map);

//spawn notification popups
notification.alert('Alert', 'some alert message');
notification.info('Info', 'some infomessage');
notification.success('Success', 'some successmessage');
notification.warning('Warning', 'some warning message');
notification.custom('Custom', 'some <span>custom</span> message'); //HTML works for every notification, not only custom()

//custom options per notification
notification.alert('Alert', 'some more important alert message', {
    timeout: 6000,
    closable: false,
    dismissable: false,
    icon: 'fa fa-times-circle',
    className: 'important-alert',
});

/* STYLE CLASS */

/* default (picture 1) */
var notifications = L.control.notifications().addTo(map);
/* pastel (picture 2) */
var pastelNotifications = L.control.notifications({ className: 'pastel' }).addTo(map);
/* modern (picture 3) */
var modernNotifications = L.control.notifications({ className: 'modern' }).addTo(map);

// add a marker with a label
L.marker([47.5, 19.05], { label: 'Budapest' }).addTo(map);

// fetch geojson data and create a polygon layer with labels
fetch('hu_megyek.geojson').then(r => r.json()).then(d => {
    L.geoJSON(d, {
        label: l => l.feature.properties.Nev, 
        labelPos: 'cc', 
        labelStyle: { color: 'darkblue', whiteSpace: 'normal', minWidth: '120px', textAlign: 'center' },
        labelPriority: l => l.feature.properties.Nepesseg,
    }).addTo(map);
});

</script>
</body>
</html>
